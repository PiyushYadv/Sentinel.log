name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Set the repository variable HF_SPACE (e.g. "your-hf-username/sentinel-log") to enable deploys
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Space files
        # Mirror the repo layout so deploy/huggingface/Dockerfile works unchanged,
        # but put the HF-specific Dockerfile, .dockerignore and README at the Space root.
        run: |
          mkdir -p space/deploy
          cp -r backend frontend space/
          cp -r deploy/huggingface space/deploy/
          cp deploy/huggingface/Dockerfile space/Dockerfile
          cp deploy/huggingface/Dockerfile.dockerignore space/.dockerignore
          cp deploy/huggingface/README.md space/README.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              folder_path="space",
              repo_id=space,
              repo_type="space",
              # Replace the Space contents wholesale so deleted files don't linger
              delete_patterns="*",
              commit_message=f"Deploy {os.environ['COMMIT_SHA'][:7]} from GitHub",
          )
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          PY
