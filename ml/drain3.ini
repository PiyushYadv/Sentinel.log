[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100

[MASKING]
masking = [{"regex_pattern":"blk_-?\\d+","mask_with":"BLOCK"},{"regex_pattern":"(?:\\d{1,3}\\.){3}\\d{1,3}","mask_with":"IP"},{"regex_pattern":"\\b\\d+\\b","mask_with":"NUM"},{"regex_pattern":"job_\\d+_\\d+","mask_with":"JOB"},{"regex_pattern":"/[^ ]+","mask_with":"PATH"}]
mask_prefix = <:
mask_suffix = :>