services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # GEMINI_API_KEY (and optional GEMINI_MODEL) are read from backend/.env;
    # without it the backend serves offline explanations.
    env_file:
      - path: ./backend/.env
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Route handlers proxy to FastAPI over the compose network
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
